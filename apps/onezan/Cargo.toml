[package]
name = "onezan"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
onezan-engine.workspace = true
onezan-vst3-host.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
eframe.workspace = true
egui.workspace = true
raw-window-handle = "0.6"
# The version eframe uses: we run its event loop ourselves.
winit = { version = "0.30", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# On X11 (plugin editors embed only there).
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The child window the plugin's editor is embedded in (a version already in Cargo.lock).
# Also the console the app attaches to (it is a GUI program there, see src/console.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
