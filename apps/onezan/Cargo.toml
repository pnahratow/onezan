[package]
name = "onezan"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
onezan-engine.workspace = true
onezan-vst3-host.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
eframe.workspace = true
egui.workspace = true
raw-window-handle = "0.6"
# The version eframe uses: we run its event loop ourselves.
winit = { version = "0.30", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# On X11 (plugin editors embed only there).
winit = { version = "0.30", default-features = false, features = ["x11"] }

[lints]
workspace = true
